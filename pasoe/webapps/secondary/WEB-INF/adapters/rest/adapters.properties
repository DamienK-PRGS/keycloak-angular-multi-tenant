# -------------------- adapters.properties ------------------------------
#
# Property File for the Pacific Application Server for OpenEdge
#
# This file defines configurable processing constraints for JSON input
# and output processing in the Pacific AppServer for OpenEdge.
#
# Detailed explanations for each property can be found in:
#
#   adapters.properties.README
#
##########################################################################

# Input Parsing Constraints

# Maximum length of a numeric token (applies to integers and floating-point numbers)
maxTokenLength=1000

# Maximum allowed length for string values
maxStringLength=20000000

# Maximum depth for nested JSON structures
maxNestingDepth=1000

# Maximum length for JSON property names
maxPropertyNameLength=50000

# Maximum allowed document size
maxDocumentLength=-1

# Output Generation Constraints

# Maximum depth for nested JSON structures during output generation
maxOutputNestingDepth=1000
