## login model
client.login.model=oauth2
OEClientPrincipalFilter.passthru=true
#OEClientPrincipalFilter.forwardToken=true
 
## JWT token handler properties for jwtAuthFilter & oauth2.resSvc..
jwtToken.keystore.jwkurl= http://localhost:8080/auth/realms/loulou/protocol/openid-connect/certs
jwtToken.usernameField=sub
## OAuth2 Resource server configuration
oauth2.resSvc.audience=account
oauth2.resSvc.tokenServices=jwt
